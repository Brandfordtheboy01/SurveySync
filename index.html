<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurveySync - Sign In</title>

    <link rel="stylesheet" href="styles/index.css" />
  </head>

  <body>
    <div class="wrapper">
      <!-- ── LEFT PANEL ── -->
      <div class="left-panel">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-icon">
            <img
              src="styles/svg/logo-google-android-studio-svgrepo-com.svg"
              alt="icon"
            />
          </div>
          <span class="logo-text">SurveySync</span>
        </div>

        <!-- FORM -->
        <form class="form-area">
          <h1>Sign In</h1>

          <!-- Username -->
          <div class="field">
            <label for="username">User Name</label>

            <div class="input-wrap">
              <input id="username" type="text" placeholder="Enter username" />
            </div>
          </div>
          <small class="username-error"></small>

          <!-- Password -->
          <div class="field">
            <label for="password">Password</label>

            <div class="input-wrap">
              <div class="icon">
                <img src="styles/svg/padlock-outlined-svgrepo-com.svg" alt="" />
              </div>

              <input
                id="password"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password"
              />
            </div>
            <small class="password-error"></small>

            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Button -->
          <button class="btn-signin" type="submit">Sign In</button>
        </form>

        <!-- Footer -->
        <p class="panel-footer">
          Don't have an account? <a href="#">Sign up</a>
        </p>
      </div>

      <!-- ── RIGHT PANEL ── -->
      <div class="right-panel">
        <img
          class="bg-image"
          src="styles/images/download - 2026-05-07T134545.837.jpg"
          alt="Background"
        />

        <div class="panel-content">
          <h2>Welcome!</h2>
          <p class="tagline">
            A platform for creating and managing surveys to <br />
            collect meaningful feedback.
          </p>

          <a href="#" class="learn-more">Learn More</a>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
