<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- ── LEFT PANEL ── -->
      <aside class="left-panel">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 16 16"><path d="M2 8L8 2L14 8L8 14Z" /></svg>
          </div>
          <span class="logo-text">space</span>
        </div>

        <!-- Form -->
        <div class="form-area">
          <h1>Sign In</h1>

          <div class="field">
            <label for="username">User Name</label>
            <div class="input-wrap">
              <div class="flag-badge">
                <span>🇺🇸</span>
              </div>
              <input
                id="username"
                type="text"
                placeholder="Enter username"
                value="Filip"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <div class="icon">
                <!-- Lock icon -->
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="11" width="14" height="10" rx="2" />
                  <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                </svg>
              </div>
              <input
                id="password"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password"
              />
            </div>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <button class="btn-signin" type="button">Sign In</button>
        </div>

        <!-- Footer -->
        <p class="panel-footer">
          Don't have an account? <a href="#">Sign up</a>
        </p>
      </aside>

      <!-- ── RIGHT PANEL ── -->
      <main class="right-panel">
        <!--
      YOUR IMAGE GOES HERE
      Replace "your-image.jpg" with your actual image path or URL.
      Example: <img src="./assets/hero.jpg" ... />
    -->
        <img class="bg-image" src="your-image.jpg" alt="Background" />

        <!-- Subtle dark overlay -->
        <div class="overlay"></div>

        <!-- Text on top -->
        <div class="panel-content">
          <p class="tagline">
            A new way to experience real estate<br />in the infinite virtual
            space.
          </p>
          <a href="#" class="learn-more">Learn More</a>
        </div>

        <!-- Next slide arrow -->
        <div class="carousel-arrow" role="button" aria-label="Next slide">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
        </div>
      </main>
    </div>
  </body>
</html>
