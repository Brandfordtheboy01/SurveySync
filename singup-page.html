<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurveySync - Sign Up</title>

    <link rel="stylesheet" href="styles/sign-up.css" />
  </head>

  <body>
    <div class="wrapper">
      <!-- ── LEFT PANEL ── -->
      <div class="left-panel">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-icon">
            <img
              src="styles/svg/logo-google-android-studio-svgrepo-com.svg"
              alt="icon"
            />
          </div>
          <span class="logo-text">SurveySync</span>
        </div>

        <!-- FORM -->
        <form class="form-area" id="signup-form">
          <h1>Sign Up</h1>
          <p class="form-subtitle">
            Welcome to SurveySync. Please sign up to your account.
          </p>

          <!-- Email -->
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <div class="icon">
                <img src="styles/svg/padlock-outlined-svgrepo-com.svg" alt="" />
              </div>
              <input
                id="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
              />
            </div>
            <small class="email-error"></small>
          </div>

          <!-- Username -->
          <div class="field">
            <label for="username">Username</label>
            <div class="input-wrap">
              <input
                id="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
              />
            </div>
            <small class="username-error"></small>
          </div>

          <!-- Password -->
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <div class="icon">
                <img src="styles/svg/padlock-outlined-svgrepo-com.svg" alt="" />
              </div>
              <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="new-password"
              />
            </div>
            <small class="password-error"></small>
          </div>

          <!-- Button -->
          <button class="btn-signin" type="submit">Sign Up</button>
        </form>

        <!-- Footer -->
        <p class="panel-footer">
          Already have an account? <a href="index.html">Login</a>
        </p>
      </div>

      <!-- ── RIGHT PANEL ── -->
      <div class="right-panel">
        <img
          class="bg-image"
          src="styles/images/Futuristic Energy Pathway.jpg"
          alt="Background"
        />
        <div class="panel-content">
          <h2>Hey There, Welcome!</h2>
          <p class="tagline">
            Create surveys, collect responses, and gain insights.
          </p>
        </div>
      </div>
    </div>

    <script src="signup.js"></script>
  </body>
</html>
